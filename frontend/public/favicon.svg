<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A0DAD"/><stop offset="1" stop-color="#DDAFF7"/></linearGradient>
  </defs>
  <!-- floor -->
  <path d="M24 80 L64 60 L64 100 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M64 60 L104 80 L64 100" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- physical half (amber): front-left wall + left half of roof -->
  <path d="M64 94 L32 78 L32 42 L64 58 Z" fill="#e07a1f"/>
  <path d="M64 58 L32 42 L64 26 Z" fill="#f59e0b"/>
  <!-- loading door -->
  <path d="M40 78 L54 85 L54 69 L40 62 Z" fill="#b85f12"/>
  <!-- digital half (purple wireframe): front-right wall + right half of roof -->
  <path d="M64 94 L96 78 L96 42 L64 58 Z" fill="#DDAFF7" fill-opacity=".15" stroke="url(#a)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 58 L64 26 L96 42 Z" fill="#DDAFF7" fill-opacity=".35" stroke="url(#a)" stroke-width="2" stroke-linejoin="round"/>
  <!-- wireframe details: shelf lines + mirrored door -->
  <path d="M64 70 L96 54 M64 82 L96 66" fill="none" stroke="#6A0DAD" stroke-width="1.5" stroke-opacity=".5" stroke-linecap="round"/>
  <path d="M74 85 L88 78 L88 62 L74 69 Z" fill="none" stroke="#6A0DAD" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- seam: dashed twin boundary -->
  <path d="M64 94 L64 26" fill="none" stroke="#2E224C" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="64" cy="26" r="3" fill="#DDAFF7" stroke="#6A0DAD" stroke-width="1.5"/>
  <circle cx="64" cy="94" r="3" fill="#DDAFF7" stroke="#6A0DAD" stroke-width="1.5"/>
</svg>
